id: net.portswigger.BurpSuite-Community
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: BurpSuiteCommunity
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --device=dri
  - --persist=.BurpSuite
  - --persist=.java
  - --env=XDG_SESSION_TYPE=x11

modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk21/install.sh
  - name: burpsuite
    buildsystem: simple
    build-commands:
      - install -Dpm755 apply_extra ${FLATPAK_DEST}/bin/apply_extra
      - install -Dpm755 BurpSuiteCommunity $FLATPAK_DEST/bin/BurpSuiteCommunity
      - install -Dpm644 net.portswigger.BurpSuite-Community.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      - install -Dpm644 net.portswigger.BurpSuite-Community.png -t ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps
      - install -Dpm644 net.portswigger.BurpSuite-Community.desktop -t ${FLATPAK_DEST}/share/applications
    sources:
      - type: script
        commands:
          - mkdir BurpSuiteCommunity && mv burpsuite.jar BurpSuiteCommunity
        dest-filename: apply_extra

      - type: script
        commands:
          - exec /app/jre/bin/java -jar /app/extra/BurpSuiteCommunity/burpsuite.jar
            "$@"
        dest-filename: BurpSuiteCommunity

      - type: file
        path: net.portswigger.BurpSuite-Community.metainfo.xml

      - type: file
        path: net.portswigger.BurpSuite-Community.png

      - type: file
        path: net.portswigger.BurpSuite-Community.desktop

      - type: extra-data
        filename: burpsuite.jar
        url: https://portswigger.net/burp/releases/download?product=desktop&version=2026.10.1&type=Jar
        sha256: e8ab086537b1643b91ca09d2fc2a6c3e08a8bae0c85280797c5c9ec76506c3c5
        size: 751385742
        x-checker-data:
          type: html
          url: https://portswigger.net/burp/downloads
          # Since 2026.4, Community and Professional share the desktop download.
          version-pattern: burpsuite_desktop_v([0-9]+(?:\.[0-9]+)+)\.jar
          url-template: https://portswigger.net/burp/releases/download?product=desktop&version=${version}&type=Jar
